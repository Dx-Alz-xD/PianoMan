<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' ws: http://localhost:* https:; worker-src 'self' blob:"
    />
    <title>PianoMan</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at 50% 30%, #1b2030 0%, #0c0e13 70%);
        color: #e7e9f0;
        font: 14px/1.4 'Inter', 'Segoe UI', system-ui, sans-serif;
        transition: opacity 0.45s ease, visibility 0.45s;
      }
      #splash.done {
        opacity: 0;
        visibility: hidden;
      }
      .splash-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        width: min(360px, 80vw);
      }
      .splash-logo {
        width: 84px;
        height: 84px;
        filter: drop-shadow(0 10px 30px rgba(124, 77, 255, 0.45));
        animation: splash-float 2.4s ease-in-out infinite;
      }
      .splash-name {
        margin: 0;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .splash-name b {
        color: #8c6cff;
      }
      .splash-keys {
        display: flex;
        gap: 4px;
        height: 34px;
      }
      .splash-keys i {
        width: 12px;
        border-radius: 0 0 4px 4px;
        background: #f2f3f7;
        animation: splash-key 1.2s ease-in-out infinite;
      }
      .splash-keys i:nth-child(2n) {
        background: #2b2f3b;
        height: 62%;
      }
      .splash-keys i:nth-child(1) { animation-delay: 0s; }
      .splash-keys i:nth-child(2) { animation-delay: 0.1s; }
      .splash-keys i:nth-child(3) { animation-delay: 0.2s; }
      .splash-keys i:nth-child(4) { animation-delay: 0.3s; }
      .splash-keys i:nth-child(5) { animation-delay: 0.4s; }
      .splash-keys i:nth-child(6) { animation-delay: 0.5s; }
      .splash-keys i:nth-child(7) { animation-delay: 0.6s; }
      .splash-bar {
        width: 100%;
        height: 5px;
        border-radius: 3px;
        background: #232838;
        overflow: hidden;
      }
      #splash-fill {
        height: 100%;
        width: 4%;
        background: linear-gradient(90deg, #8c6cff, #26c6da);
        transition: width 0.3s ease;
      }
      #splash-status {
        margin: 0;
        min-height: 20px;
        color: #8b93a7;
        font-size: 13px;
        text-align: center;
      }
      @keyframes splash-key {
        0%, 60%, 100% { transform: translateY(0); filter: none; }
        30% { transform: translateY(4px); filter: brightness(0.75) sepia(1) hue-rotate(200deg) saturate(4); }
      }
      @keyframes splash-float {
        50% { transform: translateY(-6px); }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite">
      <div class="splash-card">
        <img class="splash-logo" src="./icon.svg" alt="" />
        <h1 class="splash-name">Piano<b>Man</b></h1>
        <div class="splash-keys" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="splash-bar"><div id="splash-fill"></div></div>
        <p id="splash-status">Starting…</p>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
